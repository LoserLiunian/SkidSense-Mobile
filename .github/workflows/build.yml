name: build

# Every push to main, every pull request, every v* tag, and by hand: run the
# tests and build both apps.
#
# Two jobs, one per platform, because neither runner can do the other's half:
#
# - android (Ubuntu): the host tests (`testAndroidHostTest` — protocol,
#   cryptography against the known-answer vectors, the app controller), then
#   the debug APK, and a signed release APK when the signing secrets exist.
# - ios (macOS): the same common tests on an iOS simulator — the crypto
#   providers there are CryptoKit/CommonCrypto, not the JDK, so the vectors
#   must pass on both — then the iOS app itself, built for the simulator with
#   signing off. A device build needs an Apple team, which this repo has none
#   of yet (TEAM_ID is empty in iosApp/Configuration/Config.xcconfig).
#
# `androidDeviceTest` (RealHostPairingTest, OnDeviceCryptoTest) needs a real
# phone or emulator and a desktop to pair with, so it stays a manual run.
#
# Release signing. A phone's pairing key lives in the app's Keystore and an
# app whose signature changes can only be reinstalled, which deletes the key
# and every pairing — so APKs meant for phones must all carry one stable
# signature. Add these repository secrets to get a signed release APK:
#
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks (`base64 -i release.jks | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD      for a PKCS12 keystore (keytool's default) this is
#                             the store password: PKCS12 ignores -keypass, and a
#                             different value fails with "Given final block not
#                             properly padded"
#
# Generate one once and keep it safe — losing it means every phone has to
# uninstall and re-pair to take the next build:
#
#   keytool -genkeypair -keystore release.jks -alias skidsense \
#     -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=SkidSense"
#
# Without them (and on pull requests from forks, which never see secrets) only
# the debug APK is built. Its debug key is generated fresh on every runner, so
# a debug APK from one run will not update one installed from another run.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.idea/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.idea/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # A newer push to the same branch makes the older build moot; a tag's build
  # is the one that matters and is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # CI runs once per checkout: a long-lived daemon only holds memory.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Android（测试 + APK）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Secrets cannot be tested in a step's `if:`, so whether they exist is
      # read once here.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Numbered builds, so a newer artifact installs as an update.
      SKIDSENSE_VERSION_CODE: ${{ github.run_number }}
      SKIDSENSE_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0-ci.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches the wrapper, dependencies and the build cache, and validates the
      # wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Host tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Decode the release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "SKIDSENSE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          SKIDSENSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SKIDSENSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SKIDSENSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease --stacktrace
          # An unsigned APK here means the keystore never reached Gradle —
          # say so rather than upload something no phone will install.
          apk="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          case "$apk" in
            *unsigned*) echo "release APK 没有签名：检查 ANDROID_KEYSTORE_* 这几个 secret"; exit 1 ;;
          esac
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"

      - name: Remove the keystore
        if: always() && env.HAS_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SkidSense-Mobile-${{ env.SKIDSENSE_VERSION_NAME }}-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SkidSense-Mobile-${{ env.SKIDSENSE_VERSION_NAME }}-release
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14

  ios:
    name: iOS（模拟器测试 + App）
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native toolchain (~1 GB) downloads into ~/.konan, which the
      # Gradle cache does not cover. It is keyed on the version catalog: a
      # Kotlin bump is the only thing that changes it.
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Show Xcode
        run: xcodebuild -version

      # The test task picks a simulator itself (`simctl list devices
      # available`), so no device name is pinned to the runner image here.
      - name: Simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      # The Xcode project builds the shared framework through Gradle
      # (`embedAndSignAppleFrameworkForXcode`), so this also proves the
      # framework links into the app. Simulator only, unsigned: see the header.
      - name: iOS app (simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            SYMROOT="$RUNNER_TEMP/xcbuild" \
            OBJROOT="$RUNNER_TEMP/xcbuild/obj" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14
